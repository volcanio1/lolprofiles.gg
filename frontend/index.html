<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0908" />
    <title>lolprofiles.gg</title>
    <meta
      name="description"
      content="Look up League of Legends ranked stats, match history, live games and player habits by Riot ID."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lolprofiles.gg/" />
    <link rel="icon" type="image/png" href="/lp_logo.png" />
    <link rel="apple-touch-icon" href="/lp_logo.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Default Open Graph / Twitter Card tags — react-helmet-async overwrites
         these per-page once the app mounts; a crawler that never runs JS still
         gets a sane default. -->
    <meta property="og:site_name" content="lolprofiles.gg" />
    <meta property="og:title" content="lolprofiles.gg" />
    <meta
      property="og:description"
      content="Look up League of Legends ranked stats, match history, live games and player habits by Riot ID."
    />
    <meta property="og:image" content="https://lolprofiles.gg/lp_logo.png" />
    <meta property="og:url" content="https://lolprofiles.gg/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="lolprofiles.gg" />
    <meta
      name="twitter:description"
      content="Look up League of Legends ranked stats, match history, live games and player habits by Riot ID."
    />
    <meta name="twitter:image" content="https://lolprofiles.gg/lp_logo.png" />

    <!-- Structured data: names the site and exposes the player search to
         engines that render a sitelinks search box. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "lolprofiles.gg",
        "url": "https://lolprofiles.gg/",
        "description": "Look up League of Legends ranked stats, match history, live games and player habits by Riot ID.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://lolprofiles.gg/profile?riotId={riot_id}"
          },
          "query-input": "required name=riot_id"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
